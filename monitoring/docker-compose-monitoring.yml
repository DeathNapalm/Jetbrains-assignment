# Standalone monitoring stack: cAdvisor + Prometheus + Grafana
#
# Usage (from project root):
#   docker compose -f monitoring/docker-compose-monitoring.yml up -d
#
# Grafana:    http://localhost:3000  (admin / admin)
# Prometheus: http://localhost:9091
# cAdvisor:   http://localhost:8081
# JMX Export: http://localhost:5556/metrics

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/docker.sock:/var/run/docker.sock:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/docker/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"        # 9090 is used by YouTrack on the host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - cadvisor
      - jmx-exporter
    restart: unless-stopped
    networks:
      - monitoring

  jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter
    ports:
      - "5556:5556"
    volumes:
      - ./jmx-exporter-config.yml:/opt/bitnami/jmx-exporter/config.yml:ro
    command: ["5556", "/opt/bitnami/jmx-exporter/config.yml"]
    restart: unless-stopped
    networks:
      - monitoring
      - youtrack_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/youtrack-jmx-monitoring.json
    volumes:
      - ./prometheus-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboard.json:/etc/grafana/provisioning/dashboards/youtrack-resource-monitoring.json:ro
      - ./dashboard-jmx.json:/etc/grafana/provisioning/dashboards/youtrack-jmx-monitoring.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    name: monitoring
    driver: bridge
  youtrack_net:
    external: true
    name: jb-try1_default
